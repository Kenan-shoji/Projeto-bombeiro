<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container" style="max-width:460px;margin:8vh auto"><div class="card shadow-sm"><div class="card-body p-4"><h3>Esqueci minha senha</h3><p>Informe o e-mail cadastrado para receber um link de redefinição.</p><div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><form method="post" action="/esqueci-senha"><label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" required><button class="btn btn-danger w-100">Enviar link</button></form><a href="/login" class="d-block mt-3">Voltar ao login</a></div></div></main></body></html>
