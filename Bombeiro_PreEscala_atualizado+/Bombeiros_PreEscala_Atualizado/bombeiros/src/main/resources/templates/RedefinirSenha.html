<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container" style="max-width:460px;margin:8vh auto"><div class="card shadow-sm"><div class="card-body p-4"><h3>Nova senha</h3><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><form method="post" action="/redefinir-senha"><input type="hidden" name="token" th:value="${token}"><label class="form-label">Nova senha</label><input class="form-control mb-3" type="password" name="senha" id="senha" required><label class="form-label">Confirmar senha</label><input class="form-control mb-3" type="password" name="confirmarSenha" required><button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="const x=document.getElementById('senha');x.type=x.type==='password'?'text':'password'">Mostrar/ocultar senha</button><button class="btn btn-danger w-100">Salvar nova senha</button></form></div></div></main></body></html>
