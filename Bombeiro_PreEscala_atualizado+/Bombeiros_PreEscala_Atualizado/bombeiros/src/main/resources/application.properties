spring.datasource.url=jdbc:mysql://localhost:3306/escala_bombeiros
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Túnel HTTPS / Sessão Mobile =====
server.forward-headers-strategy=native
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true


# ===== Encerrar sessões após período de inatividade =====
# Tempo máximo sem nenhuma requisição antes de a sessão ser encerrada (padrão: 10 minutos).
# Pode ser alterado sem recompilar, ex.: SESSAO_TIMEOUT=30m
server.servlet.session.timeout=${SESSAO_TIMEOUT:10m}


# ===== Cópias de segurança periódicas do banco de dados =====
# Liga/desliga o backup automático
backup.ativo=true
# Quando executar (cron do Spring: segundo minuto hora dia mês dia-da-semana). Padrão: todo dia às 02:00
backup.cron=0 0 2 * * *
# Pasta onde os arquivos .sql são gravados (relativa à pasta de execução do projeto)
backup.diretorio=backups
# Quantos backups manter; os mais antigos são apagados (0 = nunca apagar)
backup.manter=7

# ===== Recuperação de senha por e-mail (configure as variáveis SMTP) =====
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.url=${APP_URL:http://localhost:8080}
